<style id="jeo-style">
/* Layout: one column of stacked panels; a run is drawn as a strip of game tiles, the club's own scoreboard. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #16203a; --muted: #5d6680; --line: #dbe0e8;
  --accent: #c2410c; --accent-soft: #fdeee6; --gold: #a16207; --gold-soft: #fbf3dc;
  --neg: #b42318; --win: #15803d; --tile: #eef1f6;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1320; --surface: #161d2d; --ink: #e7ebf3; --muted: #9aa3b9; --line: #273149;
  --accent: #fb8a4c; --accent-soft: #3a2116; --gold: #f2c45a; --gold-soft: #33290f;
  --neg: #f87171; --win: #4ade80; --tile: #1f2840; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #161d2d; --ink: #e7ebf3; --muted: #9aa3b9; --line: #273149;
  --accent: #fb8a4c; --accent-soft: #3a2116; --gold: #f2c45a; --gold-soft: #33290f;
  --neg: #f87171; --win: #4ade80; --tile: #1f2840; color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 800; line-height: 1.05; }
h2 { font-size: 22px; font-weight: 800; }
h3 { font-size: 16px; font-weight: 600; }
.eyebrow { font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.neg { color: var(--neg); }
.mono { font-family: var(--mono); font-size: 12px; }
section { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.head-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }

/* masthead */
.mast { display: grid; gap: 10px; }
.mast p { margin: 0; max-width: 62ch; color: var(--muted); }
.qa-link { display: inline-block; font-weight: 600; color: var(--accent); text-decoration: none; border-bottom: 1.5px solid currentColor; padding-bottom: 1px; }
.qa-link:hover { opacity: .8; }

/* hero: this season */
.hero { display: grid; gap: 18px; }
.champ { display: grid; gap: 6px; }
.champ .who { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 4.5vw, 34px); line-height: 1.1; }
.champ .cls { font: 500 13px var(--mono); color: var(--muted); margin-left: 6px; }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 6px; }
.empty strong { font-family: var(--display); font-size: 18px; }

/* run strip */
.strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.tile { min-width: 58px; padding: 6px 8px; border-radius: 8px; background: var(--tile); display: grid; gap: 1px; text-align: center; }
.tile b { font: 600 14px var(--body); font-variant-numeric: tabular-nums; }
.tile span { font: 500 10px var(--mono); color: var(--muted); }
.tile.w { box-shadow: inset 0 -3px 0 var(--win); }
.tile.l { box-shadow: inset 0 -3px 0 var(--neg); }
.tile.open { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); align-content: center; font-size: 12px; }
.total { font-family: var(--display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; color: var(--accent); }
.runs { display: grid; gap: 14px; }
.run { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.run:first-child { border-top: 0; padding-top: 0; }

/* tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.rank { font: 500 12px var(--mono); color: var(--muted); width: 2.5em; }
tr.top1 td { background: var(--gold-soft); }
tr.top1 td:first-child { border-radius: 8px 0 0 8px; } tr.top1 td:last-child { border-radius: 0 8px 8px 0; }
.name { font-weight: 600; }
.cls-chip { font: 500 11px var(--mono); color: var(--muted); margin-left: 4px; white-space: nowrap; }
.season-chip { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
.live { font: 600 10px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 4px; margin-left: 6px; white-space: nowrap; }

/* champions */
.champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.champ-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 4px; align-content: start; }
.champ-card .yr { font: 500 12px var(--mono); color: var(--gold); }
.champ-card .who { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.15; }
.champ-card .pts { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }

/* records */
.records { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.rec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 4px; align-content: start; }
.rec .val { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.rec .what { font-size: 13px; color: var(--muted); }

/* archive */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: 600 13px var(--body); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.game-players { display: grid; gap: 2px; }
.gp { display: flex; justify-content: space-between; gap: 12px; }
.gp.won .pn { font-weight: 600; }
.gp.won .ps { font-weight: 600; color: var(--win); }
.cat { font-weight: 600; }
.board-link { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.board-link span { color: var(--accent); font-size: 12px; }
.boards { display: grid; gap: 3px; }
.fj { display: grid; gap: 2px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.fj-k { font: 600 10px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-right: 4px; }
.fj-n { white-space: nowrap; }
.rnd { font: 500 11px var(--mono); color: var(--muted); margin-right: 6px; }
.mid { font-size: 11px; color: var(--muted); font-weight: 400; margin-right: 6px; }
.board-link:hover { border-bottom-color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.final-tag { font: 600 10px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-left: 6px; }

/* editor */
.btn { font: 600 14px var(--body); padding: 9px 14px; border-radius: 9px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--neg); border-color: var(--neg); }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 0; font: 600 12px var(--body); color: var(--accent); cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
form { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.prow { display: grid; grid-template-columns: minmax(0, 3fr) minmax(70px, 1fr) minmax(90px, 1.2fr); gap: 8px; }
label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
input, select { font: 15px var(--body); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; width: 100%; box-sizing: border-box; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); font-weight: 500; }
.check input { width: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--neg); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
footer { font-size: 12px; color: var(--muted); }
.m-season { display: none; }
@media (max-width: 560px) {
  td, th { padding-left: 6px; padding-right: 6px; }
  #hall th:nth-child(3), #hall td:nth-child(3) { display: none; }
  .m-season { display: block; font: 500 11px var(--mono); color: var(--muted); }
}
@media (max-width: 560px) { .prow { grid-template-columns: 1fr 1fr; } .prow label:first-child { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: no-preference) { .tile { transition: transform .15s; } .tile:hover { transform: translateY(-1px); } }
</style>

<script id="jeo-app">
(() => {
const DATA = JSON.parse(document.getElementById("jeo-data").textContent);
const app = document.getElementById("app");
const MINUS = "−";
const fmt = n => n == null ? "–" : (n < 0 ? MINUS : "") + Math.abs(n).toLocaleString("en-GB");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fdate = d => { if (!d) return ""; const [y, m, dd] = d.split("-").map(Number); return `${dd} ${MON[m - 1]} ${y}`; };
const safeUrl = u => (typeof u === "string" && /^https?:\/\/(www\.)?jeopardylabs\.com\//i.test(u.trim())) ? u.trim() : null;
const boardLink = (name, url, round) => {
  const pre = round ? `<span class="rnd">R${round}</span>` : "";
  const u = safeUrl(url);
  return `<div>${pre}${u ? `<a class="cat board-link" href="${esc(u)}" target="_blank" rel="noopener">${esc(name)}<span aria-hidden="true"> ↗</span></a>` : `<span class="cat">${esc(name)}</span>`}</div>`;
};
const fjHTML = g => !(g.fj && g.fj.length) ? "" :
  `<div class="fj">${g.fj.map(f => `<div><span class="fj-k">Final Jeopardy</span> ${esc(f.category)} <span class="fj-n">· ${f.solved} of ${f.players} right</span></div>`).join("")}</div>`;
const sc = n => `<span class="num${n < 0 ? " neg" : ""}">${fmt(n)}</span>`;
const seasonLabel = s => s.label || s.id.replace("-", "–");
const current = () => DATA.seasons.find(s => s.id === DATA.current);

/* A run starts at any game a player plays while not already on one, continues while they win,
   and ends at the first game they don't win (that game counts). Absence does not end a run.
   Finals are not part of runs. */
function runsFor(season) {
  if (season.format === "tournament") return (DATA.recordedRuns || []).filter(r => r.season === season.id).map(r => ({ ...r, games: [], open: false, recorded: true }));
  const active = new Map(), out = [];
  season.games.forEach((g, gi) => {
    if (g.final || !g.players.length || g.players.some(p => p.score == null)) return;
    const top = Math.max(...g.players.map(p => p.score));
    g.players.forEach(p => {
      let r = active.get(p.name);
      if (!r) { r = { name: p.name, cls: p.cls, season: season.id, total: 0, rounds: 0, games: [] }; active.set(p.name, r); }
      r.cls = p.cls || r.cls;
      r.total += p.score; r.rounds += 1; r.games.push({ gi, score: p.score, won: p.score === top, code: g.code });
      if (p.score < top) { r.open = false; out.push(r); active.delete(p.name); }
    });
  });
  active.forEach(r => { r.open = true; out.push(r); });
  return out;
}
const bestPerPlayer = runs => {
  const best = new Map();
  runs.forEach(r => { const b = best.get(r.name); if (!b || r.total > b.total || (r.total === b.total && r.rounds < b.rounds)) best.set(r.name, r); });
  return [...best.values()].sort((a, b) => b.total - a.total || a.rounds - b.rounds || a.name.localeCompare(b.name));
};
const winnerOf = g => { const ps = g.players.filter(p => p.score != null); if (!ps.length) return null; const top = Math.max(...ps.map(p => p.score)); return ps.filter(p => p.score === top); };
function championOf(season) {
  const finals = season.games.filter(g => g.final && winnerOf(g));
  if (!finals.length) return null;
  const last = finals[finals.length - 1];
  return { ...winnerOf(last)[0], date: last.date };
}

function strip(r, season) {
  const tiles = r.games.map(x => `<div class="tile ${x.won ? "w" : "l"}" title="${esc(season.games[x.gi].board)}"><b class="${x.score < 0 ? "neg" : ""}">${fmt(x.score)}</b><span>${esc(x.code || "")}</span></div>`).join("");
  return `<div class="strip">${tiles}${r.open ? `<div class="tile open">next game</div>` : ""}</div>`;
}

function heroHTML() {
  const s = current();
  const runs = runsFor(s);
  const played = s.games.filter(g => !g.final).length;
  const champ = championOf(s);
  let body;
  if (!s.games.length) {
    body = `<div class="empty"><strong>The board is set. No games yet.</strong><span class="muted">The first result goes up here as soon as it is played. Every win keeps a player on the board, and their run total grows until someone beats them.</span></div>`;
  } else {
    const open = runs.filter(r => r.open).sort((a, b) => b.total - a.total);
    const lead = bestPerPlayer(runs).slice(0, 10);
    body = `
      ${champ ? `<div class="champ"><div class="eyebrow">Season champion</div><div class="who">${esc(champ.name)}<span class="cls">${esc(champ.cls || "")}</span></div><div class="muted">Won the final with ${fmt(champ.score)} points.</div></div>` : ""}
      ${open.length ? `<div class="runs">${open.map(r => `<div class="run"><div class="head-row"><div><div class="eyebrow">${r.rounds > 1 || r.games.at(-1)?.won ? "On a run" : "Still on the board"}</div><div class="champ"><div class="who">${esc(r.name)}<span class="cls">${esc(r.cls || "")}</span></div></div></div><div class="total">${fmt(r.total)}</div></div>${strip(r, s)}</div>`).join("")}</div>` : ""}
      <div class="scroll"><table><thead><tr><th></th><th>Best run this season</th><th class="r">Games</th><th class="r">Points</th></tr></thead><tbody>
      ${lead.map((r, i) => `<tr class="${i === 0 ? "top1" : ""}"><td class="rank">${i + 1}</td><td><span class="name">${esc(r.name)}</span><span class="cls-chip">${esc(r.cls || "")}</span>${r.open ? `<span class="live">live</span>` : ""}</td><td class="r">${r.rounds}</td><td class="r">${sc(r.total)}</td></tr>`).join("")}
      </tbody></table></div>`;
  }
  return `<section class="panel hero" id="season">
    <div class="head-row"><div><div class="eyebrow">This season</div><h2>${esc(seasonLabel(s))}</h2></div><span class="muted num">${played} game${played === 1 ? "" : "s"} played</span></div>
    ${body}
    <div id="editor-slot"></div>
  </section>`;
}

function allRuns() { return DATA.seasons.flatMap(s => runsFor(s)); }

function hallHTML() {
  const best = bestPerPlayer(allRuns()).slice(0, 20);
  const lbl = id => seasonLabel(DATA.seasons.find(s => s.id === id) || { id });
  return `<section id="hall"><div class="head-row"><h2>Hall of Fame</h2><span class="muted">Best run per player, all seasons</span></div>
  <div class="panel scroll"><table><thead><tr><th></th><th>Player</th><th>Season</th><th class="r">Games</th><th class="r">Points</th></tr></thead><tbody>
  ${best.map((r, i) => `<tr class="${i === 0 ? "top1" : ""}"><td class="rank">${i + 1}</td><td><span class="name">${esc(r.name)}</span><span class="cls-chip">${esc(r.cls || "")}</span>${r.open && r.season === DATA.current ? `<span class="live">live</span>` : ""}<span class="m-season">${esc(lbl(r.season))}</span></td><td><span class="season-chip">${esc(lbl(r.season))}</span></td><td class="r">${r.rounds}</td><td class="r">${sc(r.total)}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="note">Spring 2021 was played as a tournament in rounds, so its two entries are the totals recorded that year.</p></section>`;
}

function champsHTML() {
  const cards = DATA.seasons.map(s => ({ s, c: championOf(s) })).filter(x => x.c).reverse();
  if (!cards.length) return "";
  return `<section id="champions"><h2>Champions</h2><div class="champs">
  ${cards.map(({ s, c }) => `<div class="champ-card"><div class="yr">${esc(seasonLabel(s))}</div><div class="who">${esc(c.name)}</div><div class="pts">${esc(c.cls || "")} · ${s.format === "tournament" ? `won the final, ${fmt(c.score)}` : `${fmt(c.score)} after the final`}</div></div>`).join("")}
  </div><p class="note">Finalists start the final with the total of their best run, so a final score includes it.</p></section>`;
}

function recordsHTML() {
  const runs = allRuns().filter(r => !r.recorded);
  const longest = [...runs].sort((a, b) => b.rounds - a.rounds || b.total - a.total)[0];
  let hi = null, games = new Map(), wins = new Map(), board = null, plays = 0, solved = 0;
  DATA.seasons.forEach(s => s.games.forEach(g => {
    if (g.final) return;
    const w = winnerOf(g) || [];
    g.players.forEach(p => {
      games.set(p.name, (games.get(p.name) || 0) + 1);
      if (p.score != null && (!hi || p.score > hi.score)) hi = { ...p, g, s };
    });
    w.forEach(p => wins.set(p.name, (wins.get(p.name) || 0) + 1));
    if (g.correct != null && g.of && (!board || g.correct / g.of > board.correct / board.of)) board = { ...g, s };
  }));
  (DATA.finalClues || []).forEach(c => { plays += c.players; solved += c.solved; });
  const top = m => { let best = null; m.forEach((v, k) => { if (!best || v > best[1]) best = [k, v]; }); return best; };
  const mg = top(games), mw = top(wins);
  const recs = [
    longest && [`${longest.rounds} games`, "Longest run", `${longest.name}, ${seasonLabel(DATA.seasons.find(s => s.id === longest.season))}`],
    hi && [fmt(hi.score), "Most points in one game", `${hi.name}, on “${hi.g.board}”, ${fdate(hi.g.date)}`],
    mw && [`${mw[1]} wins`, "Most games won", mw[0]],
    mg && [`${mg[1]} games`, "Most games played", mg[0]],
    board && [`${board.correct} of ${board.of}`, "Most correct answers in one game", `All three players together, on “${board.board}”, ${fdate(board.date)}`],
    plays && [`${Math.round(100 * solved / plays)}%`, "Final Jeopardy answers that were right", `${solved} of ${plays} attempts since 2021`],
  ].filter(Boolean);
  return `<section id="records"><h2>Records</h2><div class="records">
  ${recs.map(([v, w, who]) => `<div class="rec"><div class="eyebrow">${esc(w)}</div><div class="val">${esc(v)}</div><div class="what">${esc(who)}</div></div>`).join("")}
  </div><p class="note">Records leave out the finals. Spring 2021 counts for games and wins but not for runs.</p></section>`;
}

let archiveSeason = null;
function archiveHTML() {
  const seasons = DATA.seasons.filter(s => s.games.length);
  if (!seasons.length) return "";
  if (!archiveSeason || !seasons.find(s => s.id === archiveSeason)) archiveSeason = seasons[seasons.length - 1].id;
  const s = DATA.seasons.find(x => x.id === archiveSeason);
  const canEdit = editor.enabled && s.id === DATA.current;
  const rows = s.games.map((g, gi) => ({ g, gi })).reverse();
  return `<section id="archive"><div class="head-row"><h2>Every game</h2>
    <div class="tabs" role="group" aria-label="Season">${seasons.map(x => `<button class="tab" type="button" data-season="${esc(x.id)}" aria-pressed="${x.id === archiveSeason}">${esc(seasonLabel(x))}</button>`).join("")}</div></div>
  <div class="panel scroll"><table><thead><tr><th>Game</th><th>Board</th><th>Players</th><th class="r" title="Correct answers by all three players together">Correct</th>${canEdit ? "<th></th>" : ""}</tr></thead><tbody>
  ${rows.map(({ g, gi }) => { const w = (winnerOf(g) || []).map(p => p.name); return `<tr>
    <td><div class="mono">${esc(g.code || "")}</div><div class="muted" style="font-size:12px;white-space:nowrap">${fdate(g.date)}</div></td>
    <td>${g.final ? `<div class="final-tag" style="margin:0 0 4px">Final · two rounds</div>` : ""}<div class="boards">${boardLink(g.board, g.url, g.board2 ? "1" : "")}${g.board2 ? boardLink(g.board2, g.url2, "2") : ""}</div>${fjHTML(g)}</td>
    <td style="min-width:230px"><div class="game-players">${g.players.map(p => `<div class="gp ${w.includes(p.name) ? "won" : ""}"><span class="pn">${esc(p.name)}<span class="cls-chip">${esc(p.cls || "")}</span></span><span class="ps">${p.mid != null ? `<span class="mid" title="Score after round 1">R1 ${fmt(p.mid)} →</span>` : ""}${p.score == null ? `<span class="muted">not recorded</span>` : sc(p.score)}</span></div>`).join("")}</div></td>
    <td class="r num">${g.correct != null ? `${g.correct}/${g.of}` : "–"}</td>
    ${canEdit ? `<td><button class="link" type="button" data-edit="${gi}">Edit</button></td>` : ""}
  </tr>`; }).join("")}
  </tbody></table></div>
  <p class="note">Each game is played on one JeopardyLabs board of five categories, named after the first one. <em>Correct</em> is the number of right answers from all three players together.</p></section>`;
}

/* ---------- editor (only for people who can edit this page) ---------- */
const editor = { enabled: false, open: false, idx: null, confirmDelete: false, status: "", err: false, busy: false, artifact: null };
const knownPlayers = () => {
  const m = new Map();
  DATA.seasons.forEach(s => s.games.forEach(g => g.players.forEach(p => m.set(p.name, p.cls))));
  return m;
};
function nextCode() {
  const s = current();
  const n = s.games.filter(g => !g.final).map(g => +((g.code || "").match(/^G(\d+)$/) || [0, 0])[1]);
  return "G" + ((n.length ? Math.max(...n) : 0) + 1);
}
function editorHTML() {
  if (!editor.enabled) return "";
  const msg = editor.status ? `<span class="status ${editor.err ? "err" : ""}" role="status">${esc(editor.status)}</span>` : "";
  if (!editor.open) return `<div class="actions"><button class="btn" type="button" id="add-game">Add a game result</button>${msg}</div>`;
  const g = editor.idx != null ? current().games[editor.idx] : { code: nextCode(), date: new Date().toISOString().slice(0, 10), board: "", url: "", final: false, correct: null, of: 25, players: [{}, {}, {}] };
  const ps = [0, 1, 2].map(i => g.players[i] || {});
  const names = [...knownPlayers().keys()].sort((a, b) => a.localeCompare(b));
  return `<form id="game-form" class="panel" style="background:var(--bg)" novalidate>
    <h3>${editor.idx != null ? `Edit ${esc(g.code)}` : "Add a game result"}</h3>
    <div class="grid2">
      <label for="f-date">Date<input id="f-date" type="date" value="${esc(g.date || "")}" required></label>
      <label for="f-code">Game<input id="f-code" value="${esc(g.code || "")}" placeholder="G1"></label>
      <label for="f-cat" style="grid-column:1/-1">Board (named after its first category)<input id="f-cat" value="${esc(g.board)}" placeholder="Rhyme Time" required></label>
      <label for="f-url" style="grid-column:1/-1">JeopardyLabs link<input id="f-url" type="url" value="${esc(g.url || "")}" placeholder="https://jeopardylabs.com/play/…"></label>
    </div>
    <datalist id="players-list">${names.map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>
    ${ps.map((p, i) => `<div class="prow">
      <label for="f-n${i}">Player ${i + 1}<input id="f-n${i}" list="players-list" value="${esc(p.name || "")}" autocomplete="off"></label>
      <label for="f-c${i}">Class<input id="f-c${i}" value="${esc(p.cls || "")}" placeholder="2STC"></label>
      <label for="f-s${i}">Score<input id="f-s${i}" type="number" step="1" inputmode="numeric" value="${p.score ?? ""}"></label>
    </div>`).join("")}
    <div class="grid2">
      <label for="f-correct">Correct answers (all three players)<input id="f-correct" type="number" min="0" max="30" value="${g.correct ?? ""}"></label>
      <label for="f-of">Clues on the board<input id="f-of" type="number" min="1" max="60" value="${g.of ?? 25}"></label>
    </div>
    <div class="grid2">
      <label for="f-fjc" style="grid-column:1/-1">Final Jeopardy category<input id="f-fjc" value="${esc(g.fj?.[0]?.category || "")}" placeholder="WORD HISTORY"></label>
      <label for="f-fjs">Final Jeopardy: right answers<input id="f-fjs" type="number" min="0" max="3" value="${g.fj?.[0]?.solved ?? ""}"></label>
      <label for="f-fjp">Players who answered<input id="f-fjp" type="number" min="1" max="3" value="${g.fj?.[0]?.players ?? ""}"></label>
    </div>
    <label class="check" for="f-final"><input id="f-final" type="checkbox" ${g.final ? "checked" : ""}> This was the final (two rounds; scores include each finalist's best run)</label>
    <div id="final-extra" class="grid2" ${g.final ? "" : "hidden"}>
      <p class="note" style="grid-column:1/-1">For the final, the board above is round 1. The scores above are after round 2, and the correct answers are for both rounds together.</p>
      <label for="f-cat2">Round 2 board<input id="f-cat2" value="${esc(g.board2 || "")}"></label>
      <label for="f-url2">Round 2 link<input id="f-url2" type="url" value="${esc(g.url2 || "")}" placeholder="https://jeopardylabs.com/play/…"></label>
      ${ps.map((p, i) => `<label for="f-m${i}">Player ${i + 1} after round 1<input id="f-m${i}" type="number" step="1" inputmode="numeric" value="${p.mid ?? ""}"></label>`).join("")}
    </div>
    <p class="note">Leave a player row empty if only two played. Saving updates the page for everyone who has it open.</p>
    <div class="actions">
      <button class="btn" type="submit" ${editor.busy ? "disabled" : ""}>${editor.busy ? "Saving…" : "Save result"}</button>
      <button class="btn ghost" type="button" id="cancel-game">Cancel</button>
      ${editor.idx != null ? (editor.confirmDelete
        ? `<button class="btn danger" type="button" id="delete-yes">Delete ${esc(g.code)} for good</button><button class="link" type="button" id="delete-no">Keep it</button>`
        : `<button class="btn ghost" type="button" id="delete-game">Delete this game</button>`) : ""}
      ${msg}
    </div>
  </form>`;
}

function readForm() {
  const v = id => document.getElementById(id).value.trim();
  const players = [0, 1, 2].map(i => ({ name: v(`f-n${i}`), cls: v(`f-c${i}`).toUpperCase(), score: v(`f-s${i}`) })).filter(p => p.name);
  if (!v("f-cat")) return { error: "Add the board name." };
  if (v("f-url") && !safeUrl(v("f-url"))) return { error: "The link should be a jeopardylabs.com address, or leave it empty." };
  if (!v("f-date")) return { error: "Add the date." };
  if (players.length < 2) return { error: "Add at least two players." };
  if (players.some(p => p.score === "" || isNaN(+p.score))) return { error: "Every player needs a score (0 is fine)." };
  const known = knownPlayers();
  players.forEach(p => { p.score = Math.round(+p.score); p.cls = p.cls || known.get(p.name) || ""; });
  const c = v("f-correct");
  const final = document.getElementById("f-final").checked;
  const game = { code: v("f-code") || (final ? "Final" : ""), date: v("f-date"), board: v("f-cat"), url: safeUrl(v("f-url")), final, players, correct: c === "" ? null : +c, of: +v("f-of") || 25 };
  if (v("f-fjc")) {
    const fs = v("f-fjs"), fp = v("f-fjp");
    if (fs === "" || fp === "" || +fs > +fp) return { error: "For Final Jeopardy, add how many answered and how many were right (right can't be more than answered)." };
    game.fj = [{ category: v("f-fjc"), solved: +fs, players: +fp }].concat((editor.idx != null ? (current().games[editor.idx].fj || []).slice(1) : []));
  }
  if (final) {
    if (v("f-url2") && !safeUrl(v("f-url2"))) return { error: "The round 2 link should be a jeopardylabs.com address, or leave it empty." };
    game.board2 = v("f-cat2") || null; game.url2 = safeUrl(v("f-url2"));
    [0, 1, 2].forEach(i => { const name = v(`f-n${i}`), m = v(`f-m${i}`); const p = players.find(x => x.name === name); if (p && m !== "" && !isNaN(+m)) p.mid = Math.round(+m); });
  }
  return { game };
}

function buildDocument() {
  const head = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  const json = JSON.stringify(DATA).replace(/</g, "\\u003c");
  const fonts = [...document.querySelectorAll('link[href*="fonts.g"]')].map(l => l.outerHTML).join("\n");
  return head +
    `<title>Kongsbakken Jeopardy</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<meta name="robots" content="noindex, nofollow">\n${fonts}\n` +
    `<style id="jeo-style">${document.getElementById("jeo-style").textContent}</style>\n` +
    `<div class="wrap" id="app">\n  ${headerHTML}\n  <noscript>This page needs JavaScript to show the results.</noscript>\n</div>\n` +
    `<script type="application/json" id="jeo-data">${json}<\/script>\n` +
    `<script id="jeo-app">${document.getElementById("jeo-app").textContent}<\/script>` +
    "</body></html>";
}

async function save(mutate) {
  if (!editor.artifact) return;
  const snapshot = JSON.stringify(DATA);
  mutate();
  editor.busy = true; editor.status = ""; editor.err = false; render();
  try {
    await editor.artifact.publish(buildDocument());
    editor.open = false; editor.idx = null; editor.confirmDelete = false; editor.status = "Saved. Everyone with the page open sees it now."; editor.err = false;
  } catch (e) {
    Object.assign(DATA, JSON.parse(snapshot));
    const code = e && e.code;
    if (code === "not_writer" || code === "not_granted") { editor.enabled = false; }
    else if (code === "conflict") { editor.status = "Someone else saved first. The page is reloading with their version; add this game again after it loads."; editor.err = true; }
    else { editor.status = "Could not save (" + (code || "error") + "). Try again in a moment."; editor.err = true; }
  }
  editor.busy = false; render();
}

const headerHTML = app.querySelector("header").outerHTML;
function render() {
  app.innerHTML = headerHTML + heroHTML() + champsHTML() + hallHTML() + recordsHTML() + archiveHTML() +
    `<footer>Results kept by the English department at Kongsbakken VGS, Tromsø. Seasons 2020–21 to 2023–24 from the club's score sheets.</footer>`;
  const slot = document.getElementById("editor-slot");
  if (slot) slot.innerHTML = editorHTML();
}

app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.season) { archiveSeason = t.dataset.season; render(); return; }
  if (t.dataset.edit) { editor.open = true; editor.idx = +t.dataset.edit; editor.confirmDelete = false; editor.status = ""; render(); document.getElementById("season").scrollIntoView({ behavior: "smooth" }); return; }
  if (t.id === "add-game") { editor.open = true; editor.idx = null; editor.status = ""; render(); document.getElementById("f-cat")?.focus(); }
  if (t.id === "cancel-game") { editor.open = false; editor.idx = null; editor.confirmDelete = false; editor.status = ""; render(); }
  if (t.id === "delete-game") { editor.confirmDelete = true; render(); }
  if (t.id === "delete-no") { editor.confirmDelete = false; render(); }
  if (t.id === "delete-yes") { const i = editor.idx; save(() => current().games.splice(i, 1)); }
});
app.addEventListener("change", e => {
  if (e.target.id !== "f-final") return;
  const box = document.getElementById("final-extra"); if (box) box.hidden = !e.target.checked;
  const of = document.getElementById("f-of"); if (of && e.target.checked && +of.value === 25) of.value = 50;
});
app.addEventListener("submit", e => {
  if (e.target.id !== "game-form") return;
  e.preventDefault();
  const r = readForm();
  if (r.error) { editor.status = r.error; editor.err = true; const s = document.querySelector("#game-form .status"); if (s) { s.textContent = r.error; s.className = "status err"; } else { render(); } return; }
  const i = editor.idx;
  save(() => {
    const games = current().games;
    if (i != null) games[i] = r.game; else games.push(r.game);
    games.sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.final - b.final));
  });
});

render();

(async () => {
  try {
    const user = await window.claude?.use?.("user");
    const canEdit = user ? await user.canEdit() : false;
    if (!canEdit) return;
    const artifact = await window.claude.use("artifact");
    if (!artifact) return;
    editor.artifact = artifact; editor.enabled = true; render();
  } catch (_) { /* read-only view */ }
})();
})();
</script>

</body>
</html>
